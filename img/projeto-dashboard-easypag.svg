<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-label="Ilustração de um dashboard com indicadores, gráfico de barras e rosca">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123456"/>
      <stop offset="1" stop-color="#0a1f33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#38bdf8" stroke-opacity="0.08"/>
    </pattern>
    <clipPath id="card"><rect width="320" height="220" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="320" height="220" fill="url(#bg)"/>
    <rect width="320" height="220" fill="url(#grid)"/>
    <circle cx="20" cy="20" r="110" fill="url(#glowA)"/>
    <circle cx="310" cy="210" r="100" fill="url(#glowB)"/>

    <!-- painel -->
    <rect x="24" y="28" width="272" height="164" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#38bdf8" stroke-opacity="0.35"/>
    <circle cx="40" cy="44" r="3" fill="#ef4444" fill-opacity="0.8"/>
    <circle cx="52" cy="44" r="3" fill="#f59e0b" fill-opacity="0.8"/>
    <circle cx="64" cy="44" r="3" fill="#10b981" fill-opacity="0.8"/>

    <!-- indicadores -->
    <rect x="40" y="58" width="72" height="34" rx="6" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="48" y="66" width="30" height="4" rx="2" fill="#9db6c9" fill-opacity="0.7"/>
    <rect x="48" y="76" width="44" height="8" rx="4" fill="url(#accent)"/>

    <rect x="120" y="58" width="72" height="34" rx="6" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="128" y="66" width="30" height="4" rx="2" fill="#9db6c9" fill-opacity="0.7"/>
    <rect x="128" y="76" width="36" height="8" rx="4" fill="#ef4444" fill-opacity="0.85"/>

    <rect x="200" y="58" width="80" height="34" rx="6" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="208" y="66" width="30" height="4" rx="2" fill="#9db6c9" fill-opacity="0.7"/>
    <rect x="208" y="76" width="52" height="8" rx="4" fill="url(#accent)"/>

    <!-- barras -->
    <line x1="40" y1="178" x2="170" y2="178" stroke="#9db6c9" stroke-opacity="0.3"/>
    <g fill="url(#bar)">
      <rect x="42"  y="148" width="12" height="30" rx="3"/>
      <rect x="60"  y="134" width="12" height="44" rx="3"/>
      <rect x="78"  y="142" width="12" height="36" rx="3"/>
      <rect x="96"  y="120" width="12" height="58" rx="3"/>
      <rect x="114" y="130" width="12" height="48" rx="3"/>
      <rect x="132" y="108" width="12" height="70" rx="3"/>
      <rect x="150" y="124" width="12" height="54" rx="3"/>
    </g>
    <polyline points="48,140 66,124 84,132 102,112 120,120 138,100 156,114" fill="none" stroke="#e2f6ff" stroke-opacity="0.9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#e2f6ff">
      <circle cx="48" cy="140" r="2.5"/><circle cx="66" cy="124" r="2.5"/><circle cx="84" cy="132" r="2.5"/>
      <circle cx="102" cy="112" r="2.5"/><circle cx="120" cy="120" r="2.5"/><circle cx="138" cy="100" r="2.5"/>
      <circle cx="156" cy="114" r="2.5"/>
    </g>

    <!-- rosca -->
    <g transform="translate(240 140) rotate(-90)" fill="none" stroke-width="11">
      <circle r="26" stroke="#38bdf8" stroke-opacity="0.35"/>
      <circle r="26" stroke="url(#accent)" stroke-linecap="round" stroke-dasharray="106 58"/>
    </g>
    <rect x="228" y="136" width="24" height="4" rx="2" fill="#e2f6ff" fill-opacity="0.85"/>
    <rect x="232" y="144" width="16" height="3" rx="1.5" fill="#9db6c9" fill-opacity="0.7"/>

    <!-- selo: cobranças a vencer -->
    <g transform="translate(288 34)">
      <circle r="16" fill="url(#accent)"/>
      <circle r="6.5" fill="none" stroke="#0a1f33" stroke-width="2"/>
      <path d="M0 -3.5V0.5L2.8 2" fill="none" stroke="#0a1f33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
