<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-label="Ilustração de gráfico de candles com média móvel, curva de backtest e conferência entre duas fontes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e3a52"/>
      <stop offset="1" stop-color="#0a1f33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#38bdf8" stroke-opacity="0.08"/>
    </pattern>
    <clipPath id="card"><rect width="320" height="220" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="320" height="220" fill="url(#bg)"/>
    <rect width="320" height="220" fill="url(#grid)"/>
    <circle cx="300" cy="10" r="110" fill="url(#glowB)"/>
    <circle cx="10" cy="210" r="110" fill="url(#glowA)"/>

    <!-- painel -->
    <rect x="24" y="28" width="272" height="164" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#38bdf8" stroke-opacity="0.35"/>

    <!-- linhas de referência -->
    <g stroke="#9db6c9" stroke-opacity="0.18" stroke-dasharray="3 4">
      <line x1="40" y1="70" x2="204" y2="70"/>
      <line x1="40" y1="100" x2="204" y2="100"/>
      <line x1="40" y1="130" x2="204" y2="130"/>
    </g>

    <!-- candles -->
    <g stroke-width="1.6" stroke-linecap="round">
      <g stroke="#ef4444" fill="#ef4444" fill-opacity="0.85">
        <line x1="48" y1="96" x2="48" y2="126"/><rect x="43" y="102" width="10" height="16" rx="1.5"/>
        <line x1="108" y1="88" x2="108" y2="114"/><rect x="103" y="94" width="10" height="14" rx="1.5"/>
        <line x1="188" y1="64" x2="188" y2="92"/><rect x="183" y="72" width="10" height="14" rx="1.5"/>
      </g>
      <g stroke="#10b981" fill="#10b981" fill-opacity="0.85">
        <line x1="68" y1="100" x2="68" y2="128"/><rect x="63" y="108" width="10" height="14" rx="1.5"/>
        <line x1="88" y1="90" x2="88" y2="120"/><rect x="83" y="96" width="10" height="16" rx="1.5"/>
        <line x1="128" y1="78" x2="128" y2="110"/><rect x="123" y="84" width="10" height="18" rx="1.5"/>
        <line x1="148" y1="70" x2="148" y2="98"/><rect x="143" y="76" width="10" height="16" rx="1.5"/>
        <line x1="168" y1="52" x2="168" y2="84"/><rect x="163" y="58" width="10" height="18" rx="1.5"/>
      </g>
    </g>

    <!-- média móvel -->
    <path d="M40 116 C 70 110, 100 102, 128 92 S 178 74, 204 62" fill="none" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round"/>

    <!-- curva de backtest -->
    <path d="M40 182 L62 176 L80 178 L100 168 L122 170 L146 160 L170 162 L204 150 V186 H40 Z" fill="url(#area)"/>
    <path d="M40 182 L62 176 L80 178 L100 168 L122 170 L146 160 L170 162 L204 150" fill="none" stroke="url(#accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="204" cy="150" r="3.5" fill="#10b981"/>

    <!-- motivos de cada leitura -->
    <g>
      <circle cx="226" cy="62" r="7" fill="#10b981" fill-opacity="0.2" stroke="#10b981"/>
      <path d="M222.6 62l2.4 2.4 4-4.4" fill="none" stroke="#10b981" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="240" y="59" width="40" height="6" rx="3" fill="#e2f6ff" fill-opacity="0.75"/>

      <circle cx="226" cy="88" r="7" fill="#10b981" fill-opacity="0.2" stroke="#10b981"/>
      <path d="M222.6 88l2.4 2.4 4-4.4" fill="none" stroke="#10b981" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="240" y="85" width="32" height="6" rx="3" fill="#e2f6ff" fill-opacity="0.75"/>

      <circle cx="226" cy="114" r="7" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8"/>
      <path d="M226 110.5v4M226 117v.1" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
      <rect x="240" y="111" width="36" height="6" rx="3" fill="#9db6c9" fill-opacity="0.7"/>
    </g>

    <!-- conferência entre duas fontes -->
    <circle cx="240" cy="160" r="13" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="256" cy="160" r="13" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5"/>
    <path d="M244.5 160l2.8 2.8 5.2-5.6" fill="none" stroke="#e2f6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
